<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecera('Ingreso del personal')}"></head>
<body>
<header th:replace="~{fragments/layout :: menu}"></header>
<main class="contenedor angosto">
    <h1>Ingreso del personal</h1>
    <p class="aviso error" role="alert" th:if="${param.error}">Usuario o clave incorrectos.</p>
    <p class="aviso ok" th:if="${param.logout}">Cerraste sesión.</p>
    <form class="panel" th:action="@{/login}" method="post">
        <label>Usuario
            <input type="text" name="username" autocomplete="username" required autofocus>
        </label>
        <label>Clave
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="boton">Ingresar</button>
    </form>
</main>
<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
